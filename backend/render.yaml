services:
  - type: web
    name: e-credits-api
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        value: production-secret-netzerocalc-esg
