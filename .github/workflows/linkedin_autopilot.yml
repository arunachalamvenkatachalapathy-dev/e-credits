name: LinkedIn Autopilot v3.0 Daily Newsroom

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 08:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run LinkedIn Autopilot Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python backend/run_autopilot.py

      - name: Archive Published Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: published-posts
          path: backend/published_posts/

      - name: Commit Memory Updates
        run: |
          git config --global user.name "LinkedIn Autopilot Bot"
          git config --global user.email "bot@linkedin-autopilot.local"
          git add linkedin_autopilot_memory.db backend/published_posts/ || true
          git diff-index --quiet HEAD || git commit -m "chore(autopilot): update publication memory log [skip ci]"
          git push || true
